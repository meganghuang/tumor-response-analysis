# Configuration for the Sade-Feldman melanoma immunotherapy scRNA-seq pipeline.
# Every tunable threshold in the analysis is declared here; no magic numbers in code.

dataset:
  accession: GSE120575
  base_url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE120nnn/GSE120575/suppl/
  tpm_file: GSE120575_Sade_Feldman_melanoma_single_cells_TPM_GEO.txt.gz
  metadata_file: GSE120575_patient_ID_single_cells.txt.gz

paths:
  raw: data/raw
  processed: data/processed
  results: results

qc:
  min_genes: 1000        # Smart-seq2 plates; low-complexity wells are empty/dying
  max_genes: 10000       # doublet-leaning upper tail
  max_pct_mito: 20.0
  min_cells_per_gene: 10
  min_cells_per_sample: 50

normalisation:
  # Data are distributed as TPM. Sade-Feldman et al. use log2(TPM/10 + 1);
  # dividing by 10 reflects the ~100k-transcript complexity of a single cell.
  tpm_scale: 10.0
  log_base: 2

embedding:
  n_top_genes: 2000
  hvg_flavor: seurat
  scale_max_value: 10
  n_pcs: 30
  n_neighbors: 15
  knn_transformer: sklearn   # exact kNN; 'pynndescent' for approximate
  leiden_resolution: 1.0
  cd8_leiden_resolution: 0.5
  random_state: 0

annotation:
  # A cluster is left Unresolved only when no lineage programme scores above the
  # cross-cluster mean (z <= 0). No winner-take-all margin rule is applied: a
  # margin rule discards cells whose top two lineages are both plausible, which
  # in this dataset strands ~45% of T cells.
  min_z: 0.0

composition:
  min_cells_per_unit: 100   # biopsies with fewer cells give unstable proportions
  fdr_alpha: 0.1

differential_expression:
  min_cells_per_patient: 10     # cells of the focal population needed to pseudobulk a patient
  min_patients_expressing: 5    # gene must be detected in this many patients
  min_detection_rate: 0.05      # ... and in this fraction of cells of the population
  fdr_alpha: 0.1

signatures:
  size: 25              # genes per direction (up in responders / up in non-responders)
  n_permutations: 1000  # label permutations for the AUC null
  random_state: 0
