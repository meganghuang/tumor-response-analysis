[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "melanoma-icb-pipeline"
version = "1.0.0"
description = "Cell-population dynamics and response signatures in melanoma checkpoint immunotherapy (GSE120575)"
requires-python = ">=3.10"
dependencies = [
  "scanpy>=1.10", "anndata>=0.10", "leidenalg", "igraph", "numpy", "pandas",
  "scipy", "scikit-learn", "statsmodels", "matplotlib", "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
